<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Lite</title><style>
body{font-family:Arial,sans-serif;max-width:760px;margin:30px auto;padding:0 16px;background:#f4f7fb;color:#172033}
header,.card{background:white;padding:18px;border-radius:12px;margin-bottom:14px;box-shadow:0 1px 5px #0001}
a{color:#1459a6;margin-right:12px} input,textarea{box-sizing:border-box;width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccd3df;border-radius:7px}
button{background:#1459a6;color:white;border:0;padding:10px 14px;border-radius:7px;cursor:pointer}
.flash{background:#fff4cc;padding:10px;border-radius:7px;margin:8px 0}.muted{color:#64748b;font-size:.9em}.post{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body>
<header><h1>Social Lite</h1><nav><a href="{{ url_for('index') }}">Home feed</a>
{% if username %}<span>Signed in as <b>{{ username }}</b></span>
<form action="{{ url_for('logout') }}" method="post" style="display:inline"><button type="submit">Sign out</button></form>
{% else %}<a href="{{ url_for('login') }}">Sign in</a><a href="{{ url_for('register') }}">Create account</a>{% endif %}</nav></header>
{% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</body></html>
